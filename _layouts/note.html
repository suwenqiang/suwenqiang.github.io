---
layout: default
---

<article class="note-article">
  <header class="note-header">
    {% if page.categories and page.categories.size > 0 %}
    <p class="note-kicker">{{ page.categories | join: " / " }}</p>
    {% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.date %}
    <p class="note-meta">{{ page.date | date: "%Y-%m-%d" }}</p>
    {% endif %}
  </header>

  {{ content }}
</article>
