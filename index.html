<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>suwenqiang.github.io</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(160deg, #f4f7fb, #dfe9f5);
        color: #122033;
      }
      main {
        width: min(680px, calc(100vw - 32px));
        padding: 40px 32px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 18px 48px rgba(18, 32, 51, 0.12);
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 3rem);
      }
      p {
        margin: 0;
        line-height: 1.6;
        font-size: 1.05rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>suwenqiang.github.io</h1>
      <p>This GitHub Pages site is now enabled and serving from the repository root.</p>
    </main>
  </body>
</html>
